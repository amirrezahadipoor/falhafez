name: Android CI — Universal Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Validate corpus assets
        run: python3 tools/validate_corpus.py

      # دروازهٔ کیفیتِ محتوا: تفسیرِ قالبی، متنِ تکراری، شرحِ بریده،
      # نویزِ ویرایشی و انتسابِ نادرستِ شاعر را می‌گیرد.
      - name: Validate content quality
        run: python3 tools/validate_content.py

      # کامنت‌های بلوکیِ کاتلین تودرتو می‌شوند، پس یک «/*» داخلِ متنِ KDoc
      # (مثلاً در مسیری مثل corpus/*.dat) بقیهٔ فایل را می‌بلعد. کامپایلر آن را
      # ده‌ها خط پایین‌تر و با پیامِ گمراه‌کنندهٔ «Missing '}'» گزارش می‌کند.
      # این بررسیِ چندثانیه‌ای جلوی هدررفتنِ یک بیلدِ کاملِ گرِیدل را می‌گیرد.
      - name: Validate Kotlin comments
        run: python3 tools/validate_kotlin_comments.py

      - name: Run unit tests
        run: chmod +x gradlew && ./gradlew testReleaseUnitTest --no-daemon

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_PATH }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > release.keystore

      # Universal release APK: single APK containing every ABI
      # (arm64-v8a, armeabi-v7a, x86, x86_64) — no debug APK, no AAB splits.
      - name: Build universal release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon --no-build-cache --stacktrace

      - name: Inspect assets (diagnostic)
        run: |
          echo "=== source assets ==="
          ls -la app/src/main/assets/corpus/
          echo "=== merged assets ==="
          ls -la app/build/intermediates/assets/release/mergeReleaseAssets/corpus/ 2>/dev/null || echo "no merged dir"
          echo "=== APK corpus entries ==="
          unzip -l app/build/outputs/apk/release/app-release.apk | grep corpus || echo "no corpus in apk"

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/FalHafez-universal-release.apk

      - name: Upload universal release APK
        uses: actions/upload-artifact@v4
        with:
          name: falhafez-universal-release
          path: dist/FalHafez-universal-release.apk
          retention-days: 30
