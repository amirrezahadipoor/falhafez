name: Store Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Run on emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -skin 1080x2280
          script: |
            adb shell wm size
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.amirrezahadipoor.falhafez.debug/com.amirrezahadipoor.falhafez.MainActivity
            for i in $(seq 1 30); do
              adb logcat -d 2>/dev/null | grep -q "Corpus seeded" && break
              sleep 2
            done
            sleep 2
            adb exec-out screencap -p > 01-splash.png
            adb shell input tap 540 1700
            sleep 4
            adb exec-out screencap -p > 02-onboarding.png
            adb shell input tap 540 1700
            sleep 4
            adb exec-out screencap -p > 03-home.png
            adb shell input tap 540 1500
            sleep 14
            adb exec-out screencap -p > 04-draw.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: "*.png"
          retention-days: 14
