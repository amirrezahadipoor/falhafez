name: Store Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpulse0

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Run on emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -skin 1080x2280
          script: |
            adb shell wm size
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.amirrezahadipoor.falhafez.debug/com.amirrezahadipoor.falhafez.MainActivity
            sleep 25
            adb exec-out screencap -p > 01-onboarding.png
            adb shell input tap 540 1560
            sleep 5
            adb exec-out screencap -p > 02-home.png
            adb shell input tap 540 1100
            sleep 16
            adb exec-out screencap -p > 03-reveal.png
            adb shell input tap 540 1500
            sleep 7
            adb exec-out screencap -p > 04-interpretation.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: "*.png"
          retention-days: 14
